[project]
name = "indian-filings-rag"
version = "0.1.0"
description = "Page-grounded hybrid retrieval and evaluation over Indian company filings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pdfplumber>=0.11,<0.12",
    "numpy>=2,<3",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
    "isort>=9.0.2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "streamlit>=1.66,<2",
    "pandas>=2,<4",
]

[project.scripts]
filings = "filings_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_rag"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
